# C2 / exfil static crypto public keys (e.g. X25519 server pubkey) embedded in
# the agent. Distinct from payload hashes: a key authenticates/encrypts the C2
# channel. Populate from live feeds.
[pubkeys]
# Wave 3 (July 2026) stage-2 Rust infostealer/RAT/SSH-worm — C2 X25519 server
# static public key (source: ysf stage-2 analysis gist)
"2d15205b422f6137ab08c728e2ae0ca38d07b5153723b373d12532d8bebb6a48" = "atomic-arch-2026-08"
